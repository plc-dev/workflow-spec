# Valid: step invocation with reads / secrets / writes (design.md D8c, ~lines 669-682).
irVersion: 1
name: step-with-secrets-example
sessionState:
  sandbox_dump:
    interactivity: batch
inputParameters:
  - query
steps:
  - id: runQuery
    service: "registry.internal/sql-exec@sha256:9f2c8e1a0000000000000000000000000000000000000000000000000000abcd"
    function: query
    dependsOn: [loadDump]
    reads:
      dump: { from: session, key: sandbox_dump }
      sql: { from: request, param: query }
    secrets:
      apiKey: { scope: writer, name: sqlExecApiKey }
    writes:
      dump: { to: session, key: sandbox_dump }
outputs:
  rows: { from: step, id: runQuery, output: rows }
