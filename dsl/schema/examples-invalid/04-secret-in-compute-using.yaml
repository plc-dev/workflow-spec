# INVALID: a secret reference ({ scope, name }) is placed inside a compute
# binding's 'using' map. D8c/D7/D10: secrets are a SEPARATE category, never a
# Binding kind, so they cannot appear where a Binding is expected. The value
# { scope: writer, name: apiKey } matches no Binding kind and should fail.
irVersion: 1
name: bad-secret-in-using
steps:
  - id: classify
    kind: branch
    selector:
      compute: { ">": [{ var: "n" }, 1] }
      using:
        n: { scope: writer, name: apiKey }
    cases:
      "true":
        steps:
          - id: a
            service: "registry.internal/a@sha256:aaaa000000000000000000000000000000000000000000000000000000000001"
            function: go
